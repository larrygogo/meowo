[package]
name = "meowo-agent"
version = "0.1.0"
edition = "2021"
# Windows 会把文件名含 install 的无清单 exe 启发式识别成安装器并弹 UAC；关闭自动测试目标，
# 在下方给联网测试一个不含 install 的二进制名。
autotests = false

[dependencies]
meowo-protocol = { path = "../meowo-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
# claude 模型目录：在约 300MB 的可执行里分块定位内嵌 model-catalog（见 plugins/claude/catalog.rs）。
# 早已是传递依赖，不新增下载。
memchr = "2"
# 只给 opencode 用：它不写会话日志，对话全在自己的 SQLite 库里（见 plugins/opencode/store.rs）。
# reporter 经 meowo-store 早已链接同一份 bundled sqlite，不增加二进制体积。
rusqlite = { workspace = true }
# 读终端输入框（composer.rs）按插件声明的正则认框。regex 早在工作区依赖树里，不新增下载。
regex = "1"

[dev-dependencies]
# 与 meowo-protocol 同一套契约生成机制：cfg(test) 下 derive(TS)，
# `cargo test -p meowo-agent --lib` 导出 app/src/generated/contracts/*.ts，CI diff 把关。
ts-rs = "12"

[[test]]
name = "agent_urls_live"
path = "tests/install_urls_live.rs"

# autotests = false 关掉了自动发现，新增集成测试必须在这里登记。
[[test]]
name = "subagent_live"
path = "tests/subagent_live.rs"

[[test]]
name = "fleet_live"
path = "tests/fleet_live.rs"

[[test]]
name = "todo_live"
path = "tests/todo_live.rs"

[[test]]
name = "rewind_live"
path = "tests/rewind_live.rs"
